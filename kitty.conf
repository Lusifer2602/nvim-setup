# ╔══════════════════════════════════════════════════════════════╗
# ║                 KITTY — TOKYO NIGHT                        ║
# ║              modern developer workstation                  ║
# ╚══════════════════════════════════════════════════════════════╝

#Add this to the .bashrc file to get tokyonight like layout for your terminal
#PS1='\[\e[38;5;111m\]╭─ \[\e[38;5;141m\]\u@\h\[\e[0m\] \[\e[38;5;117m\]\w\[\e[0m\]\n\[\e[38;5;111m\]╰─❯ \[\e[0m\]'

. "$HOME/.local/bin/env"

# ──────────────────────────────────────────────────────────────
# FONT
# ──────────────────────────────────────────────────────────────

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

disable_ligatures never


# ──────────────────────────────────────────────────────────────
# WINDOW
# ──────────────────────────────────────────────────────────────

background_opacity 0.88

dynamic_background_opacity yes

hide_window_decorations no

window_padding_width 12
window_padding_height 10

window_border_width 1.5

active_border_color   #7aa2f7
inactive_border_color #292e42

inactive_text_alpha 0.85

placement_strategy center

remember_window_size yes


# ──────────────────────────────────────────────────────────────
# CURSOR
# ──────────────────────────────────────────────────────────────

cursor_shape block

cursor_blink_interval 0

cursor_stop_blinking_after 0

cursor #c0caf5

cursor_text_color #1a1b26


# ──────────────────────────────────────────────────────────────
# SCROLLBACK
# ──────────────────────────────────────────────────────────────

scrollback_lines 10000

scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS


# ──────────────────────────────────────────────────────────────
# MOUSE
# ──────────────────────────────────────────────────────────────

mouse_hide_wait 3.0

url_color #7dcfff

underline_hyperlinks always 

open_url_with default


# ──────────────────────────────────────────────────────────────
# SHELL INTEGRATION
# ──────────────────────────────────────────────────────────────

shell_integration enabled


# Keep the block cursor at the shell prompt.
shell_integration no-cursor


# Let Kitty know the current directory and command.
# This makes tab/window titles much more useful.


# ──────────────────────────────────────────────────────────────
# TAB BAR
# ──────────────────────────────────────────────────────────────

tab_bar_edge top

tab_bar_style powerline

tab_powerline_style slanted

tab_bar_min_tabs 1

tab_bar_margin_width 8

tab_bar_background #16161e

tab_separator " "

tab_activity_symbol " ●"

tab_title_max_length 32

tab_title_template "  {index}  {title}  "

active_tab_title_template "  ✦ {index}  {title}  "

active_tab_foreground #1a1b26
active_tab_background #7aa2f7
active_tab_font_style bold

inactive_tab_foreground #787c99
inactive_tab_background #1f2335
inactive_tab_font_style normal


# ──────────────────────────────────────────────────────────────
# COLORS — TOKYO NIGHT
# ──────────────────────────────────────────────────────────────

foreground #c0caf5

background #1a1b26

selection_foreground #c0caf5
selection_background #33467c

url_color #7dcfff


# Black
color0  #15161e
color8  #414868

# Red
color1  #f7768e
color9  #f7768e

# Green
color2  #73daca
color10 #73daca

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5


# ──────────────────────────────────────────────────────────────
# KEYBOARD
# ──────────────────────────────────────────────────────────────

# Clipboard — Windows-style
map ctrl+v paste_from_clipboard


# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab

map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6


# Move between tabs
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab


# Reload Kitty config
map ctrl+shift+f5 load_config_file


# ──────────────────────────────────────────────────────────────
# TAB MANAGEMENT
# ──────────────────────────────────────────────────────────────

map ctrl+shift+alt+right move_tab_forward
map ctrl+shift+alt+left move_tab_backward


# ──────────────────────────────────────────────────────────────
# TERMINAL WINDOWS / SPLITS
# ──────────────────────────────────────────────────────────────

map ctrl+shift+enter new_window

map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window bottom
map ctrl+shift+k neighboring_window top
map ctrl+shift+l neighboring_window right
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end


# ──────────────────────────────────────────────────────────────
# MISC
# ──────────────────────────────────────────────────────────────

confirm_os_window_close 0

enable_audio_bell no

visual_bell_duration 0.0

allow_remote_control no
